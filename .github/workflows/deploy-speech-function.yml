
name: Deploy Speech Function

on:
  push:
    branches:
      - main
    paths:
      - "api/speech/**"
      - ".github/workflows/deploy-speech-function.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-blog-audiobook
          package: api/speech
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
