name: Deploy Speech Function

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/deploy-speech-function.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-blog-audiobook
          sku: flexconsumption
          package: api/speech
